<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Grip League</title>

    <meta name="theme-color" content="#17212b">

    <link rel="stylesheet" href="css/styles.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<div id="app">

    <!-- HEADER -->
    <header class="topbar">

        <div class="brand">

            <div class="logo">
                💪
            </div>

            <div>

                <h1>Grip League</h1>

                <p id="welcomeText">
                    Welcome
                </p>

            </div>

        </div>

    </header>


    <!-- MAIN CONTENT -->

    <main id="content">


        <!-- TRAIN SCREEN -->

        <section id="trainScreen" class="screen active">

    <div class="card hero">

        <h2>Grip Workout</h2>

        <div class="settings">

            <label for="readyInput">Ready (sec)</label>
            <input id="readyInput" type="number" value="3" min="1" max="10">

            <label for="squeezeInput">Squeeze (sec)</label>
            <input id="squeezeInput" type="number" value="5" min="1" max="30">

            <label for="releaseInput">Release (sec)</label>
            <input id="releaseInput" type="number" value="3" min="1" max="20">

            <label for="switchInput">Switch Hands (sec)</label>
            <input id="switchInput" type="number" value="4" min="1" max="15">

            <label for="repsInput">Reps per Hand</label>
            <input id="repsInput" type="number" value="10" min="1" max="30">

            <label for="setsInput">Sets</label>
            <input id="setsInput" type="number" value="3" min="1" max="10">

        </div>

        <button id="startWorkoutBtn" class="primaryButton">
            Start Workout
        </button>

    </div>

    <div class="card">

        <h3>Today's Goal</h3>

        <p>Complete one full workout.</p>

    </div>

    <div class="card">

        <h3>Quick Stats</h3>

        <div class="statRow">

            <div>
                <span class="label">Best Grip</span>
                <strong id="bestGripValue">-- kg</strong>
            </div>

            <div>
                <span class="label">Workouts</span>
                <strong id="workoutCount">0</strong>
            </div>

        </div>

    </div>

</section>


        <!-- LEADERBOARD -->

        <section id="leaderboardScreen" class="screen">

            <div class="card">

                <h2>League</h2>

                <p>Top grip athletes.</p>

            </div>

            <div id="leaderboardList">

            </div>

        </section>



        <!-- PROFILE -->

        <section id="profileScreen" class="screen">

            <div class="card profileCard">

                <div class="avatar" id="avatar">
                    👤
                </div>

                <h2 id="profileName">
                    Loading...
                </h2>

                <p id="profileUsername">

                </p>

            </div>


            <div class="card">

                <h3>Your Personal Record</h3>

                <strong id="profilePR">
                    -- kg
                </strong>

            </div>

        </section>


    </main>



    <!-- BOTTOM NAVIGATION -->

    <nav class="bottomNav">

        <button class="navButton active"
                data-screen="trainScreen">

            🏋️

            <span>Train</span>

        </button>


        <button class="navButton"
                data-screen="leaderboardScreen">

            🏆

            <span>League</span>

        </button>


        <button class="navButton"
                data-screen="profileScreen">

            👤

            <span>Profile</span>

        </button>

    </nav>

</div>



<script src="js/telegram.js"></script>
<script src="js/timer.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/profile.js"></script>
<script src="js/app.js"></script>

</body>
</html>
