<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grip League</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#0f1115;
    color:white;
    padding:20px;
}

.container {
    max-width:500px;
    margin:auto;
}

.card {
    background:#171a21;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
}

h1 {
    text-align:center;
}

input {
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:12px;
    border:none;
    font-size:18px;
    box-sizing:border-box;
}

button {
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#57c7ff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.ratio {
    font-size:40px;
    text-align:center;
    color:#7effb2;
}

.rank {
    padding:12px;
    background:#1f2430;
    border-radius:12px;
    margin-top:10px;
}

.small {
    color:#aaa;
}
</style>

</head>

<body>

<div class="container">

<div class="card">
<h1>💪 Grip League</h1>

<p id="user">
Loading Telegram user...
</p>

</div>


<div class="card">

<h2>Your attempt</h2>

<label>Bodyweight (kg)</label>

<input id="weight" type="number" placeholder="86">


<label>Max grip strength (kg)</label>

<input id="grip" type="number" placeholder="105">


<div class="ratio" id="ratio">
0.00x
</div>


<button onclick="submitScore()">
Submit attempt 💪
</button>

</div>


<div class="card">

<h2>🏆 Leaderboard</h2>

<div id="leaderboard">
Loading...
</div>

</div>


</div>
<script>

const SUPABASE_URL = "https://bnofjgenwfspdmhlkmvj.supabase.co/rest/v1/";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJub2ZqZ2Vud2ZzcGRtaGxrbXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTM4NjAsImV4cCI6MjEwMDQ2OTg2MH0.lOB_XTqJYNNW3ZcZauthll0ipVvAoyA1tlWsPVuBQtk";


// Telegram connection

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


let telegramUser = {
    id: null,
    username: null,
    first_name: "Guest"
};


if (tg.initDataUnsafe && tg.initDataUnsafe.user) {

    telegramUser = tg.initDataUnsafe.user;

    document.getElementById("user").innerHTML =
    `
    👋 ${telegramUser.first_name}
    <br>
    <span class="small">
    @${telegramUser.username || "no_username"}
    </span>
    `;

} else {

    document.getElementById("user").innerHTML =
    `
    👋 Browser mode
    <br>
    <span class="small">
    Open through Telegram for competition
    </span>
    `;

}



// Calculate ratio

const weightInput =
document.getElementById("weight");

const gripInput =
document.getElementById("grip");


function updateRatio(){

    let weight =
    Number(weightInput.value);

    let grip =
    Number(gripInput.value);


    if(weight > 0 && grip > 0){

        let ratio =
        (grip / weight).toFixed(2);

        document.getElementById("ratio")
        .innerHTML =
        ratio + "x";

    }

}


weightInput.addEventListener(
"input",
updateRatio
);


gripInput.addEventListener(
"input",
updateRatio
);




// Save score

async function submitScore(){


let weight =
Number(weightInput.value);


let grip =
Number(gripInput.value);


if(!weight || !grip){

alert("Enter bodyweight and grip strength");

return;

}


let ratio =
(grip / weight).toFixed(3);



let data = {

telegram_id:
telegramUser.id || Date.now(),

username:
telegramUser.username || "guest",

first_name:
telegramUser.first_name || "Guest",

bodyweight:
weight,

grip_strength:
grip,

ratio:
ratio

};



let response =
await fetch(
SUPABASE_URL + "/rest/v1/grip_scores",
{

method:"POST",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + SUPABASE_KEY,

"Prefer":
"return=minimal"

},

body:
JSON.stringify(data)

});



if(response.ok){

alert(
"💪 Score submitted!"
);

loadLeaderboard();


}

else{

let errorText = await response.text();

alert(
"Error:\n" + errorText
);

}




// Load leaderboard


async function loadLeaderboard(){


let response =
await fetch(
SUPABASE_URL +
"/rest/v1/grip_scores?select=*&order=ratio.desc&limit=20",
{

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + SUPABASE_KEY

}

});



let scores =
await response.json();



let html="";



scores.forEach(
(score,index)=>{


html +=

`

<div class="rank">

<b>
${index+1}.
${score.first_name}

</b>

<br>

💪 ${score.grip_strength} kg

<br>

⚖️ ${score.ratio}x

</div>

`;



});



document.getElementById(
"leaderboard"
)
.innerHTML =
html || "No scores yet";



}



loadLeaderboard();


</script>
</body>
</html>
